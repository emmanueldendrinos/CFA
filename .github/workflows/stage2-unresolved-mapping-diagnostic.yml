name: Stage 2 Unresolved Mapping Diagnostic

on:
  push:
    paths:
      - 'scripts/windows/Diagnose-CfaStage2UnresolvedMappings.ps1'
      - 'candidate-analysis/CFA-Stage2-Mapping-Decisions.csv'
      - 'candidate-analysis/ASRP-Q2-Pair-Identity-Frozen-v1.0.0.csv'
      - '.github/workflows/stage2-unresolved-mapping-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse diagnostic with PowerShell 7
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\windows\Diagnose-CfaStage2UnresolvedMappings.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; throw 'Diagnostic failed PowerShell 7 parsing.' }

      - name: Parse diagnostic with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\windows\Diagnose-CfaStage2UnresolvedMappings.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; throw 'Diagnostic failed Windows PowerShell 5.1 parsing.' }

      - name: Self-test mapping diagnostic
        shell: powershell
        run: .\scripts\windows\Diagnose-CfaStage2UnresolvedMappings.ps1 -SelfTest

      - name: Diagnose unresolved mappings
        shell: powershell
        run: .\scripts\windows\Diagnose-CfaStage2UnresolvedMappings.ps1

      - name: Commit mapping diagnostic
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $allowed = @(
            'docs/evidence/stage2-unresolved-mapping-diagnostic.md',
            'candidate-analysis/CFA-Stage2-Unresolved-Mapping-Diagnostic.csv'
          )
          git -c core.autocrlf=false add -- $allowed
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -gt 0) {
            foreach ($path in $staged) { if ($allowed -notcontains $path) { throw "Unexpected staged path: $path" } }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish CFA Stage 2 unresolved mapping diagnostic'
            git pull --rebase origin main
            git push origin HEAD:main
          }
