name: Stage 2 Kinto GeckoTerminal Validation

on:
  push:
    paths:
      - 'scripts/windows/Verify-CfaStage2KintoGeckoTerminal.ps1'
      - 'scripts/windows/Verify-CfaStage2KintoGeckoTerminalTokenData.ps1'
      - 'candidate-analysis/CFA-Stage2-GeckoTerminal-Kinto-Seeds.csv'
      - '.github/workflows/stage2-kinto-geckoterminal-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Kinto verifiers with PowerShell 7
        shell: pwsh
        run: |
          foreach($path in @('.\scripts\windows\Verify-CfaStage2KintoGeckoTerminal.ps1','.\scripts\windows\Verify-CfaStage2KintoGeckoTerminalTokenData.ps1')){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; throw "Kinto GeckoTerminal verifier failed PowerShell 7 parsing: $path" }
          }

      - name: Parse Kinto verifiers with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($path in @('.\scripts\windows\Verify-CfaStage2KintoGeckoTerminal.ps1','.\scripts\windows\Verify-CfaStage2KintoGeckoTerminalTokenData.ps1')){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; throw "Kinto GeckoTerminal verifier failed Windows PowerShell 5.1 parsing: $path" }
          }

      - name: Self-test Kinto token-info verifier
        shell: powershell
        run: .\scripts\windows\Verify-CfaStage2KintoGeckoTerminal.ps1 -SelfTest

      - name: Self-test Kinto token-data verifier
        shell: powershell
        run: .\scripts\windows\Verify-CfaStage2KintoGeckoTerminalTokenData.ps1 -SelfTest

      - name: Acquire exact Kinto token-info evidence
        shell: powershell
        run: .\scripts\windows\Verify-CfaStage2KintoGeckoTerminal.ps1

      - name: Acquire exact Kinto token-data evidence
        shell: powershell
        run: .\scripts\windows\Verify-CfaStage2KintoGeckoTerminalTokenData.ps1

      - name: Upload Kinto GeckoTerminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: cfa-stage2-kinto-geckoterminal-evidence
          path: |
            candidate-analysis/CFA-Stage2-GeckoTerminal-Kinto-Evidence.csv
            candidate-analysis/CFA-Stage2-GeckoTerminal-Kinto-TokenData-Evidence.csv
            docs/evidence/stage2-kinto-geckoterminal-evidence.md
            docs/evidence/stage2-kinto-geckoterminal-token-data-evidence.md
          if-no-files-found: error
          retention-days: 7

      - name: Commit exact Kinto evidence
        if: github.event_name == 'push'
        shell: powershell
        run: |
          $allowed=@(
            'candidate-analysis/CFA-Stage2-GeckoTerminal-Kinto-Evidence.csv',
            'candidate-analysis/CFA-Stage2-GeckoTerminal-Kinto-TokenData-Evidence.csv',
            'docs/evidence/stage2-kinto-geckoterminal-evidence.md',
            'docs/evidence/stage2-kinto-geckoterminal-token-data-evidence.md'
          )
          git -c core.autocrlf=false add -- $allowed
          $staged=@(git diff --cached --name-only)
          foreach($path in $staged){if($allowed-notcontains$path){throw "Unexpected staged Kinto evidence path: $path"}}
          $unstaged=@(git diff --name-only)
          if($unstaged.Count -gt 0){throw ('Unexpected unstaged paths before Kinto evidence commit: '+($unstaged-join','))}
          if($staged.Count -gt 0){
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish CFA Stage 2 Kinto GeckoTerminal evidence'
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          }
