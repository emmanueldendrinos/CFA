name: Stage 3 Context V3 Validation

on:
  push:
    paths:
      - 'scripts/windows/Build-CfaStage3ContextInventoryV3.ps1'
      - '.github/workflows/stage3-context-v3-validation.yml'
  pull_request:
    paths:
      - 'scripts/windows/Build-CfaStage3ContextInventoryV3.ps1'
      - '.github/workflows/stage3-context-v3-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse V3 with PowerShell 7
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\windows\Build-CfaStage3ContextInventoryV3.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count-gt0){$errors|ForEach-Object{Write-Host $_.Message};throw 'V3 failed PowerShell 7 parsing.'}

      - name: Parse V3 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\windows\Build-CfaStage3ContextInventoryV3.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count-gt0){$errors|ForEach-Object{Write-Host $_.Message};throw 'V3 failed Windows PowerShell 5.1 parsing.'}

      - name: Self-test V3 with PowerShell 7
        shell: pwsh
        run: .\scripts\windows\Build-CfaStage3ContextInventoryV3.ps1 -SelfTest

      - name: Self-test V3 with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Build-CfaStage3ContextInventoryV3.ps1 -SelfTest

      - name: Validate exact V3 inputs
        shell: powershell
        run: .\scripts\windows\Build-CfaStage3ContextInventoryV3.ps1 -ValidateInputsOnly

      - name: Enforce bounded-storage design
        shell: powershell
        run: |
          $text=Get-Content '.\scripts\windows\Build-CfaStage3ContextInventoryV3.ps1' -Raw
          foreach($required in @('CFA_STAGE3_CONTEXT_V3_BOUNDED_TWO_PASS','MinFreeGB=15','CandidateKey','Materialize','context-discovery-selection.csv','context-discovery-reading.csv')){
            if($text-notmatch[regex]::Escape($required)){throw "V3 bounded-storage requirement missing: $required"}
          }
          if($text-match'worker-\{0:D3\}-edge\.csv'){throw 'V3 reintroduced full-context oversample worker CSVs.'}
          Write-Host 'CFA STAGE 3 CONTEXT V3 BOUNDED STORAGE: PASS'
