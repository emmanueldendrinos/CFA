name: CFA Recovery Inventory Validation

on:
  push:
    branches:
      - 'cfa/recovery-inventory-ci-20260829'
    paths:
      - 'scripts/windows/Inspect-CfaRecoveryInventory.ps1'
      - '.github/workflows/recovery-inventory-validation.yml'
  pull_request:
    paths:
      - 'scripts/windows/Inspect-CfaRecoveryInventory.ps1'
      - '.github/workflows/recovery-inventory-validation.yml'

permissions:
  contents: read

jobs:
  validate-recovery-inventory:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\windows\Inspect-CfaRecoveryInventory.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'Recovery inventory failed PowerShell 7 parsing.'
          }

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\windows\Inspect-CfaRecoveryInventory.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'Recovery inventory failed Windows PowerShell 5.1 parsing.'
          }

      - name: Run exact Windows PowerShell 5.1 self-test
        shell: powershell
        run: |
          & .\scripts\windows\Inspect-CfaRecoveryInventory.ps1 -SelfTest
          $code=if($null-eq$LASTEXITCODE){0}else{[int]$LASTEXITCODE}
          if($code-ne0){throw "Recovery inventory self-test failed with exit $code."}
