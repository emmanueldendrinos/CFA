name: GCS GDELT Archive V6 Validation

on:
  push:
    paths:
      - 'scripts/windows/Resume-CfaGdeltQ2ToGcsV6.ps1'
      - '.github/workflows/gcs-gdelt-archive-v6-validation.yml'
  pull_request:
    paths:
      - 'scripts/windows/Resume-CfaGdeltQ2ToGcsV6.ps1'
      - '.github/workflows/gcs-gdelt-archive-v6-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse V6 with PowerShell 7
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\windows\Resume-CfaGdeltQ2ToGcsV6.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count-gt0){$errors|ForEach-Object{Write-Host $_.Message};throw 'V6 failed PowerShell 7 parsing.'}

      - name: Parse V6 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\windows\Resume-CfaGdeltQ2ToGcsV6.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count-gt0){$errors|ForEach-Object{Write-Host $_.Message};throw 'V6 failed Windows PowerShell 5.1 parsing.'}

      - name: Self-test V6 with PowerShell 7
        shell: pwsh
        run: .\scripts\windows\Resume-CfaGdeltQ2ToGcsV6.ps1 -ResumeRunRoot . -SelfTest

      - name: Self-test V6 with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Resume-CfaGdeltQ2ToGcsV6.ps1 -ResumeRunRoot . -SelfTest

      - name: Enforce native stderr guard
        shell: powershell
        run: |
          $text=Get-Content '.\scripts\windows\Resume-CfaGdeltQ2ToGcsV6.ps1' -Raw
          foreach($required in @("`$ErrorActionPreference='Continue'",'expected-native-stderr','Native stderr + nonzero regression: PASS','Resume-CfaGdeltQ2ToGcsV5.ps1')){
            if($text -notmatch [regex]::Escape($required)){throw "Required V6 marker missing: $required"}
          }
          if($text -match 'Remove-Item.+gdelt-gkg-q2-2025'){throw 'Unexpected source deletion logic found.'}
