name: Stage 2 Direct CoinGecko ID Validation

on:
  push:
    paths:
      - 'scripts/windows/Verify-CfaStage2DirectCoinGeckoIds.ps1'
      - 'scripts/windows/Apply-CfaStage2CanonicalMappings.ps1'
      - 'scripts/windows/Validate-CfaStage2XrepBlocker.ps1'
      - 'candidate-analysis/CFA-Stage2-Direct-CoinGecko-ID-Seeds.csv'
      - 'candidate-analysis/CFA-Stage2-Mapping-Canonical-Adjudications.csv'
      - '.github/workflows/stage2-direct-coingecko-id-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse verifier with PowerShell 7
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\windows\Verify-CfaStage2DirectCoinGeckoIds.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; throw 'Direct ID verifier failed PowerShell 7 parsing.' }

      - name: Parse verifier with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\windows\Verify-CfaStage2DirectCoinGeckoIds.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; throw 'Direct ID verifier failed Windows PowerShell 5.1 parsing.' }

      - name: Self-test direct ID verifier
        shell: powershell
        run: .\scripts\windows\Verify-CfaStage2DirectCoinGeckoIds.ps1 -SelfTest

      - name: Self-test canonical mapping overlay
        shell: powershell
        run: .\scripts\windows\Apply-CfaStage2CanonicalMappings.ps1 -SelfTest

      - name: Self-test XREP blocker dependency
        shell: powershell
        run: .\scripts\windows\Validate-CfaStage2XrepBlocker.ps1 -SelfTest

      - name: Resolve current mapping decisions for lifecycle validation
        shell: powershell
        run: |
          .\scripts\windows\Resolve-CfaStage2Mappings.ps1
          .\scripts\windows\Apply-CfaStage2CanonicalMappings.ps1

      - name: Verify direct CoinGecko IDs
        shell: powershell
        run: |
          $global:LASTEXITCODE=$null
          & .\scripts\windows\Verify-CfaStage2DirectCoinGeckoIds.ps1 -DelayMs 12000
          $code=if($null -eq $LASTEXITCODE){0}else{[int]$LASTEXITCODE}
          if ($code -ne 0 -and $code -ne 2) { throw "Direct CoinGecko ID verifier failed with exit $code." }
          Write-Host "DIRECT_ID_EVIDENCE_EXIT=$code"
          $global:LASTEXITCODE=0

      - name: Validate XREP blocker against fresh direct evidence
        shell: powershell
        run: |
          $global:LASTEXITCODE=$null
          & .\scripts\windows\Validate-CfaStage2XrepBlocker.ps1
          $code=if($null-eq$LASTEXITCODE){0}else{[int]$LASTEXITCODE}
          if($code-ne0){throw "XREP blocker invalidated by fresh direct evidence; exit $code."}
          $global:LASTEXITCODE=0

      - name: Refresh dependent mapping evidence for publication
        shell: powershell
        run: |
          .\scripts\windows\Resolve-CfaStage2Mappings.ps1
          .\scripts\windows\Apply-CfaStage2CanonicalMappings.ps1
          $allowed=@(
            'candidate-analysis/CFA-Stage2-Direct-CoinGecko-ID-Evidence.csv',
            'docs/evidence/stage2-direct-coingecko-id-evidence.md',
            'candidate-analysis/CFA-Stage2-Mapping-Decisions.csv',
            'docs/evidence/stage2-mapping-decisions.md',
            'docs/evidence/stage2-mapping-decisions.json'
          )
          $dirty=@(git diff --name-only)
          foreach($path in $dirty){if($allowed-notcontains$path){throw "Unexpected dirty path before atomic Stage 2 evidence publish: $path"}}
          Write-Host ('Atomic Stage 2 evidence dirty paths: '+($dirty-join','))

      - name: Upload direct ID evidence
        uses: actions/upload-artifact@v4
        with:
          name: cfa-stage2-direct-id-evidence
          path: |
            candidate-analysis/CFA-Stage2-Direct-CoinGecko-ID-Evidence.csv
            docs/evidence/stage2-direct-coingecko-id-evidence.md
          if-no-files-found: error
          retention-days: 7

      - name: Commit direct and dependent mapping evidence atomically
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $direct=@(
            'candidate-analysis/CFA-Stage2-Direct-CoinGecko-ID-Evidence.csv',
            'docs/evidence/stage2-direct-coingecko-id-evidence.md'
          )
          $allowed=@(
            'candidate-analysis/CFA-Stage2-Direct-CoinGecko-ID-Evidence.csv',
            'docs/evidence/stage2-direct-coingecko-id-evidence.md',
            'candidate-analysis/CFA-Stage2-Mapping-Decisions.csv',
            'docs/evidence/stage2-mapping-decisions.md',
            'docs/evidence/stage2-mapping-decisions.json'
          )
          $dirty=@(git diff --name-only)
          foreach($path in $dirty){if($allowed-notcontains$path){throw "Unexpected dirty path before atomic Stage 2 evidence transaction: $path"}}

          $saved=Join-Path $env:RUNNER_TEMP ('cfa-stage2-direct-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $saved -Force|Out-Null
          foreach($path in $direct){
            $target=Join-Path $saved ([IO.Path]::GetFileName($path))
            Copy-Item -LiteralPath $path -Destination $target -Force
          }

          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          if($LASTEXITCODE-ne0){throw 'Could not rebase clean Stage 2 evidence transaction onto latest main.'}

          foreach($path in $direct){
            $source=Join-Path $saved ([IO.Path]::GetFileName($path))
            Copy-Item -LiteralPath $source -Destination $path -Force
          }
          $global:LASTEXITCODE=$null
          & .\scripts\windows\Validate-CfaStage2XrepBlocker.ps1
          $xrepCode=if($null-eq$LASTEXITCODE){0}else{[int]$LASTEXITCODE}
          if($xrepCode-ne0){throw "XREP blocker invalidated after rebase by fresh direct evidence; exit $xrepCode."}
          .\scripts\windows\Resolve-CfaStage2Mappings.ps1
          if($LASTEXITCODE-ne0){throw 'Stage 2 mapping resolver failed during atomic evidence publication.'}
          .\scripts\windows\Apply-CfaStage2CanonicalMappings.ps1
          if($LASTEXITCODE-ne0){throw 'Stage 2 canonical mapping overlay failed during atomic evidence publication.'}

          $dirty=@(git diff --name-only)
          foreach($path in $dirty){if($allowed-notcontains$path){throw "Unexpected dirty path after atomic Stage 2 evidence regeneration: $path"}}
          git -c core.autocrlf=false add -- $allowed
          $staged=@(git diff --cached --name-only)
          foreach($path in $staged){if($allowed-notcontains$path){throw "Unexpected staged path: $path"}}
          $unstaged=@(git diff --name-only)
          if($unstaged.Count-gt0){throw ('Unexpected unstaged paths before atomic Stage 2 evidence commit: '+($unstaged-join','))}
          if($staged.Count-gt0){
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish CFA Stage 2 direct and dependent mapping evidence'
            git push origin HEAD:main
          }
