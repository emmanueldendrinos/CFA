name: Stage 3 Simple News Matching Validation

on:
  push:
    paths:
      - 'scripts/windows/Verify-CfaActiveNewsInputs.ps1'
      - 'scripts/windows/Review-CfaStage2Identity.ps1'
      - 'scripts/windows/Build-CfaStage3NewsAliases.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatching.ps1'
      - 'candidate-analysis/ASRP-Q2-Pair-Identity-Frozen-v1.0.0.csv'
      - 'candidate-analysis/ASRP-Q2-GDELT-GKG-Operational-Aliases-v1.0.0.csv'
      - 'candidate-analysis/CFA-Stage2-Alias-Semantic-Decisions.csv'
      - 'candidate-analysis/CFA-Stage3-Alias-Match-Overrides.csv'
      - 'docs/evidence/stage3-sample-review-20260827.json'
      - 'docs/evidence/stage3-sample-review-20260827.md'
      - 'docs/evidence/stage3-simple-news-matching-contract.md'
      - '.github/workflows/stage3-simple-news-matching-validation.yml'
  pull_request:
    paths:
      - 'scripts/windows/Verify-CfaActiveNewsInputs.ps1'
      - 'scripts/windows/Review-CfaStage2Identity.ps1'
      - 'scripts/windows/Build-CfaStage3NewsAliases.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatching.ps1'
      - 'candidate-analysis/ASRP-Q2-Pair-Identity-Frozen-v1.0.0.csv'
      - 'candidate-analysis/ASRP-Q2-GDELT-GKG-Operational-Aliases-v1.0.0.csv'
      - 'candidate-analysis/CFA-Stage2-Alias-Semantic-Decisions.csv'
      - 'candidate-analysis/CFA-Stage3-Alias-Match-Overrides.csv'
      - 'docs/evidence/stage3-sample-review-20260827.json'
      - 'docs/evidence/stage3-sample-review-20260827.md'
      - 'docs/evidence/stage3-simple-news-matching-contract.md'
      - '.github/workflows/stage3-simple-news-matching-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse active news scripts with PowerShell 7
        shell: pwsh
        run: |
          foreach($path in @(
            '.\scripts\windows\Verify-CfaActiveNewsInputs.ps1',
            '.\scripts\windows\Review-CfaStage2Identity.ps1',
            '.\scripts\windows\Build-CfaStage3NewsAliases.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatching.ps1'
          )){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count-gt0){$errors|ForEach-Object{Write-Host $_.Message};throw "Active news script failed PowerShell 7 parsing: $path"}
          }

      - name: Parse active news scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($path in @(
            '.\scripts\windows\Verify-CfaActiveNewsInputs.ps1',
            '.\scripts\windows\Review-CfaStage2Identity.ps1',
            '.\scripts\windows\Build-CfaStage3NewsAliases.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatching.ps1'
          )){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count-gt0){$errors|ForEach-Object{Write-Host $_.Message};throw "Active news script failed Windows PowerShell 5.1 parsing: $path"}
          }

      - name: Self-test active input verifier
        shell: powershell
        run: .\scripts\windows\Verify-CfaActiveNewsInputs.ps1 -SelfTest

      - name: Self-test Stage 2 news readiness
        shell: powershell
        run: .\scripts\windows\Review-CfaStage2Identity.ps1 -SelfTest

      - name: Self-test Stage 3 alias builder
        shell: powershell
        run: .\scripts\windows\Build-CfaStage3NewsAliases.ps1 -SelfTest

      - name: Self-test Stage 3 matcher precision rules
        shell: powershell
        run: .\scripts\windows\Run-CfaStage3NewsMatching.ps1 -SelfTest

      - name: Verify exact active source bytes
        shell: powershell
        run: .\scripts\windows\Verify-CfaActiveNewsInputs.ps1

      - name: Verify Stage 2 Kraken and seed-alias readiness
        shell: powershell
        run: .\scripts\windows\Review-CfaStage2Identity.ps1

      - name: Build full Kraken news alias universe
        shell: powershell
        run: .\scripts\windows\Build-CfaStage3NewsAliases.ps1

      - name: Validate Stage 3 precision evidence and overrides
        shell: powershell
        run: |
          $review=Get-Content -LiteralPath '.\docs\evidence\stage3-sample-review-20260827.json' -Raw|ConvertFrom-Json
          if(([string]$review.gates.'CFA-S3-004') -ne 'UNVERIFIED'){throw 'Prior CFA-S3-004 invalidation state is not UNVERIFIED.'}
          if(([string]$review.gates.'CFA-S3-005') -ne 'FAIL'){throw 'Prior CFA-S3-005 review is not recorded as FAIL.'}
          if(([string]$review.gates.'CFA-S3-006') -ne 'BLOCKED'){throw 'CFA-S3-006 must remain BLOCKED.'}
          $overrides=@(Import-Csv -LiteralPath '.\candidate-analysis\CFA-Stage3-Alias-Match-Overrides.csv')
          if($overrides.Count-ne2){throw "Expected exactly 2 evidence-driven match-policy overrides; observed $($overrides.Count)."}
          $expected=@{'SHIB|shiba inu'='TITLE_CRYPTO_NAME';'XXRP|ripple'='TITLE_CRYPTO_NAME'}
          foreach($row in $overrides){
            $key=([string]$row.base_asset_id)+'|'+([string]$row.alias_text).Trim().ToLowerInvariant()
            if(-not$expected.ContainsKey($key)){throw "Unexpected Stage 3 match-policy override: $key"}
            if(([string]$row.match_policy) -ne ([string]$expected[$key])){throw "Unexpected policy for ${key}: $($row.match_policy)"}
            [void]$expected.Remove($key)
          }
          if($expected.Count-ne0){throw 'Required Stage 3 match-policy override is missing.'}
          Write-Host 'CFA STAGE 3 PRECISION EVIDENCE: PASS'

      - name: Validate matcher inputs on full universe
        shell: powershell
        run: .\scripts\windows\Run-CfaStage3NewsMatching.ps1 -ValidateInputsOnly

      - name: Enforce Stage 3 entry contract
        shell: powershell
        run: |
          $review=Get-Content -LiteralPath '.\docs\evidence\stage2-identity-review.json' -Raw|ConvertFrom-Json
          $byId=@{};foreach($g in @($review.gates)){$byId[[string]$g.gate_id]=$g}
          if([string]$byId['CFA-S2-003'].status-ne'NOT_APPLICABLE'){throw 'CoinGecko mapping gate is still active.'}
          if([string]$byId['CFA-S2-005'].status-ne'PASS'){throw 'Alias semantic gate is not PASS.'}
          if([string]$byId['CFA-S2-006'].status-ne'PASS'){throw 'Stage 3 entry gate is not PASS.'}
          $universe=Get-Content -LiteralPath '.\docs\evidence\stage3-news-alias-universe.json' -Raw|ConvertFrom-Json
          if([string]$universe.status-ne'PASS'){throw 'S3-ID-01 is not PASS.'}
          if([int]$universe.news_assets-ne431){throw "S3-ID-01 news asset count is $($universe.news_assets), expected 431."}
          if([int]$universe.cross_asset_alias_collisions-ne0){throw 'S3-ID-01 has cross-asset alias collisions.'}
          Write-Host 'CFA STAGE 3 ENTRY CONTRACT: PASS'
