name: CFA Stage 11 V2 Scanner Source Readiness Validation

on:
  push:
    branches:
      - cfa/stage11-live-scanner-contract-20260910
    paths:
      - 'scripts/windows/Repair-CfaStage11BreadthTimestampV2.ps1'
      - 'scripts/windows/Validate-CfaStage11ScannerSourceReadinessV2.ps1'
      - '.github/workflows/stage11-scanner-source-readiness-v2-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse V2 repair and validator PowerShell 7
        shell: pwsh
        run: |
          foreach($p in @('.\scripts\windows\Repair-CfaStage11BreadthTimestampV2.ps1','.\scripts\windows\Validate-CfaStage11ScannerSourceReadinessV2.ps1')){$t=$null;$e=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$t,[ref]$e)|Out-Null;if($e.Count){$e|ForEach-Object{Write-Host "$p line $($_.Extent.StartLineNumber): $($_.Message)"};throw "Parse failed: $p"}}
      - name: Parse V2 repair and validator Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($p in @('.\scripts\windows\Repair-CfaStage11BreadthTimestampV2.ps1','.\scripts\windows\Validate-CfaStage11ScannerSourceReadinessV2.ps1')){$t=$null;$e=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$t,[ref]$e)|Out-Null;if($e.Count){$e|ForEach-Object{Write-Host "$p line $($_.Extent.StartLineNumber): $($_.Message)"};throw "Parse failed: $p"}}
      - name: Self-test V2 repair PowerShell 7
        shell: pwsh
        run: .\scripts\windows\Repair-CfaStage11BreadthTimestampV2.ps1 -RunReceiptPath x -SelfTest
      - name: Self-test V2 repair Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Repair-CfaStage11BreadthTimestampV2.ps1 -RunReceiptPath x -SelfTest
      - name: Self-test V2 validator PowerShell 7
        shell: pwsh
        run: .\scripts\windows\Validate-CfaStage11ScannerSourceReadinessV2.ps1 -RunReceiptPath x -SelfTest
      - name: Self-test V2 validator Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Validate-CfaStage11ScannerSourceReadinessV2.ps1 -RunReceiptPath x -SelfTest
      - name: Enforce V2 correction boundary
        shell: pwsh
        run: |
          $repair=Get-Content '.\scripts\windows\Repair-CfaStage11BreadthTimestampV2.ps1' -Raw
          $validator=Get-Content '.\scripts\windows\Validate-CfaStage11ScannerSourceReadinessV2.ps1' -Raw
          foreach($s in @($repair,$validator)){if($s -match 'FWD_RETURN|FWD_ABNORMAL|hit_rate|alert_precision|alert_recall'){throw 'Forward-performance logic is forbidden in Stage 11 V2.'}}
          if($repair -notmatch 'SCANNER_SOURCE_READINESS_V2'){throw 'V2 repair identity missing.'}
          if($validator -notmatch 'RANGE BETWEEN interval'){throw 'Independent RANGE-window recomputation missing.'}
          if($repair -match 'YYYY-MM-DD\\"T\\"'){throw 'Escaped to_char timestamp pattern regression detected.'}
