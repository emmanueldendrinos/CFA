name: CFA Stage 4 Response Source Validation

on:
  push:
    paths:
      - 'scripts/windows/Inspect-CfaStage4ResponseSource.ps1'
      - 'scripts/windows/Build-CfaStage4Responses.ps1'
      - 'scripts/windows/Build-CfaStage4ResponsesV2.ps1'
      - 'scripts/windows/Build-CfaStage4ResponsesV3.ps1'
      - 'scripts/windows/Diagnose-CfaStage4DayEndCoverage.ps1'
      - 'docs/evidence/stage4-response-contract.md'
      - 'docs/evidence/stage4-v2-bounded-response-review-20260830.md'
      - '.github/workflows/stage4-response-source-validation.yml'
  pull_request:
    paths:
      - 'scripts/windows/Inspect-CfaStage4ResponseSource.ps1'
      - 'scripts/windows/Build-CfaStage4Responses.ps1'
      - 'scripts/windows/Build-CfaStage4ResponsesV2.ps1'
      - 'scripts/windows/Build-CfaStage4ResponsesV3.ps1'
      - 'scripts/windows/Diagnose-CfaStage4DayEndCoverage.ps1'
      - 'docs/evidence/stage4-response-contract.md'
      - 'docs/evidence/stage4-v2-bounded-response-review-20260830.md'
      - '.github/workflows/stage4-response-source-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse Stage 4 scripts with PowerShell 7
        shell: pwsh
        run: |
          $files=@(
            '.\scripts\windows\Inspect-CfaStage4ResponseSource.ps1',
            '.\scripts\windows\Build-CfaStage4Responses.ps1',
            '.\scripts\windows\Build-CfaStage4ResponsesV2.ps1',
            '.\scripts\windows\Build-CfaStage4ResponsesV3.ps1',
            '.\scripts\windows\Diagnose-CfaStage4DayEndCoverage.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count-gt0){
              $errors|ForEach-Object{Write-Host "$file :: line $($_.Extent.StartLineNumber), col $($_.Extent.StartColumnNumber) :: <$($_.Extent.Text)> :: $($_.Message)"}
              throw "PowerShell 7 parse failed: $file"
            }
          }

      - name: Parse Stage 4 scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files=@(
            '.\scripts\windows\Inspect-CfaStage4ResponseSource.ps1',
            '.\scripts\windows\Build-CfaStage4Responses.ps1',
            '.\scripts\windows\Build-CfaStage4ResponsesV2.ps1',
            '.\scripts\windows\Build-CfaStage4ResponsesV3.ps1',
            '.\scripts\windows\Diagnose-CfaStage4DayEndCoverage.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count-gt0){
              $errors|ForEach-Object{Write-Host "$file :: line $($_.Extent.StartLineNumber), col $($_.Extent.StartColumnNumber) :: <$($_.Extent.Text)> :: $($_.Message)"}
              throw "Windows PowerShell 5.1 parse failed: $file"
            }
          }

      - name: Run Stage 4 source inspector self-test
        shell: powershell
        run: .\scripts\windows\Inspect-CfaStage4ResponseSource.ps1 -SelfTest

      - name: Run historical exact-2359 constructor self-test
        shell: powershell
        run: .\scripts\windows\Build-CfaStage4Responses.ps1 -SelfTest

      - name: Run day-end diagnostic self-test
        shell: powershell
        run: .\scripts\windows\Diagnose-CfaStage4DayEndCoverage.ps1 -SelfTest

      - name: Run historical V2 last-observed constructor self-test
        shell: powershell
        run: .\scripts\windows\Build-CfaStage4ResponsesV2.ps1 -SelfTest

      - name: Run V3 cutoff-safe constructor self-test
        shell: powershell
        run: .\scripts\windows\Build-CfaStage4ResponsesV3.ps1 -SelfTest

      - name: Enforce current Stage 4 fail-closed contract
        shell: powershell
        run: |
          $inspect=Get-Content '.\scripts\windows\Inspect-CfaStage4ResponseSource.ps1' -Raw
          $historical=Get-Content '.\scripts\windows\Build-CfaStage4Responses.ps1' -Raw
          $diag=Get-Content '.\scripts\windows\Diagnose-CfaStage4DayEndCoverage.ps1' -Raw
          $v2=Get-Content '.\scripts\windows\Build-CfaStage4ResponsesV2.ps1' -Raw
          $v3=Get-Content '.\scripts\windows\Build-CfaStage4ResponsesV3.ps1' -Raw
          $contract=Get-Content '.\docs\evidence\stage4-response-contract.md' -Raw
          $review=Get-Content '.\docs\evidence\stage4-v2-bounded-response-review-20260830.md' -Raw

          foreach($marker in @(
            'EXACT_2359_FAILED',
            'LAST_OBSERVED_V2_REVIEW_FAILED',
            'UTC_DAY_OBS_RULE_FROZEN_FOR_VALIDATION',
            'RET_USD_UTC_DAY_OBS_LOG',
            'CFA-S4-008',
            'FAIL',
            'CFA-S4-009',
            'CFA-S4-011',
            'CFA-S4-012',
            'PASS',
            'CFA-S4-013',
            'UNVERIFIED',
            'CFA-S4-014',
            'BLOCKED',
            'CFA-S4-015',
            '37,058',
            'No imputation'
          )){
            if($contract -notmatch [regex]::Escape($marker)){throw "Stage 4 contract marker missing: $marker"}
          }

          foreach($marker in @('37 / 40','89 to 2,779','SDN','CFA-S4-011','FAIL')){
            if($review -notmatch [regex]::Escape($marker)){throw "Stage 4 V2 review marker missing: $marker"}
          }

          foreach($marker in @('default_transaction_read_only=on','asrp.q2_market_1m_observations','stage4-market-columns.csv','stage4-usd-pair-candidates.csv')){
            if($inspect -notmatch [regex]::Escape($marker)){throw "Stage 4 inspector marker missing: $marker"}
          }
          foreach($marker in @('RET_USD_1D_LOG','ExpectedDirectUsdPairs = 434',"TIME '23:59:00'",'Math]::Log')){
            if($historical -notmatch [regex]::Escape($marker)){throw "Historical Stage 4 constructor marker missing: $marker"}
          }
          foreach($marker in @('stage4-day-end-global-summary.csv','consecutive_day_last_observed_candidates','CFA-S4-007')){
            if($diag -notmatch [regex]::Escape($marker)){throw "Stage 4 diagnostic marker missing: $marker"}
          }
          foreach($marker in @('RET_USD_1D_LOG_LAST_OBS','ExpectedResponses = 36505','Math]::Log')){
            if($v2 -notmatch [regex]::Escape($marker)){throw "Historical V2 marker missing: $marker"}
          }
          foreach($marker in @(
            'RET_USD_UTC_DAY_OBS_LOG',
            'ExpectedActiveUsdPairDays = 37058',
            'first_rows',
            'last_rows',
            'first_open_price',
            'last_close_price',
            'Math]::Log',
            'stage4-responses-v3.csv',
            'stage4-response-v3-review-sample.csv',
            'stage4-response-v3-candidate.json',
            "'CFA-S4-013'='PASS'",
            "'CFA-S4-014'='UNVERIFIED'",
            "'CFA-S4-015'='BLOCKED'"
          )){
            if($v3 -notmatch [regex]::Escape($marker)){throw "Stage 4 V3 constructor marker missing: $marker"}
          }

          foreach($text in @($inspect,$historical,$diag,$v2,$v3)){
            if($text -match '(?i)INSERT\s+INTO|UPDATE\s+[^\r\n]+\s+SET|DELETE\s+FROM|CREATE\s+TABLE|ALTER\s+TABLE|DROP\s+TABLE'){
              throw 'Stage 4 script contains a forbidden database write/DDL marker.'
            }
          }
