name: CFA Stage 3 Finalization Validation

on:
  push:
    paths:
      - 'scripts/windows/Adjudicate-CfaStage3ExistingRun.ps1'
      - 'scripts/windows/Prepare-CfaStage3SampleReview.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatchingParallel.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatchingParallelV2.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatchingParallelV2R1.ps1'
      - 'scripts/windows/Test-CfaStage3NewsMatchingParallelV2Rules.ps1'
      - '.github/workflows/stage3-finalization-validation.yml'
  pull_request:
    paths:
      - 'scripts/windows/Adjudicate-CfaStage3ExistingRun.ps1'
      - 'scripts/windows/Prepare-CfaStage3SampleReview.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatchingParallel.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatchingParallelV2.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatchingParallelV2R1.ps1'
      - 'scripts/windows/Test-CfaStage3NewsMatchingParallelV2Rules.ps1'
      - '.github/workflows/stage3-finalization-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse finalization scripts with PowerShell 7
        shell: pwsh
        run: |
          $files=@(
            '.\scripts\windows\Adjudicate-CfaStage3ExistingRun.ps1',
            '.\scripts\windows\Prepare-CfaStage3SampleReview.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatchingParallel.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatchingParallelV2.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatchingParallelV2R1.ps1',
            '.\scripts\windows\Test-CfaStage3NewsMatchingParallelV2Rules.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count-gt0){$errors|ForEach-Object{Write-Host "$file :: $($_.Message)"};throw "PowerShell 7 parse failed: $file"}
          }

      - name: Parse finalization scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files=@(
            '.\scripts\windows\Adjudicate-CfaStage3ExistingRun.ps1',
            '.\scripts\windows\Prepare-CfaStage3SampleReview.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatchingParallel.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatchingParallelV2.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatchingParallelV2R1.ps1',
            '.\scripts\windows\Test-CfaStage3NewsMatchingParallelV2Rules.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count-gt0){$errors|ForEach-Object{Write-Host "$file :: $($_.Message)"};throw "Windows PowerShell 5.1 parse failed: $file"}
          }

      - name: Run exact Windows PowerShell 5.1 adjudication self-test
        shell: powershell
        run: .\scripts\windows\Adjudicate-CfaStage3ExistingRun.ps1 -SelfTest

      - name: Run exact Windows PowerShell 5.1 sample-review self-test
        shell: powershell
        run: .\scripts\windows\Prepare-CfaStage3SampleReview.ps1 -SelfTest

      - name: Run exact Windows PowerShell 5.1 parallel matcher V1 self-test
        shell: powershell
        run: .\scripts\windows\Run-CfaStage3NewsMatchingParallel.ps1 -SelfTest

      - name: Run exact Windows PowerShell 5.1 V2 rule regression test
        shell: powershell
        run: .\scripts\windows\Test-CfaStage3NewsMatchingParallelV2Rules.ps1

      - name: Run exact Windows PowerShell 5.1 V2 R1 controller self-test
        shell: powershell
        run: .\scripts\windows\Run-CfaStage3NewsMatchingParallelV2R1.ps1 -SelfTest

      - name: Enforce corrected Stage 3 source precision and resume contract
        shell: powershell
        run: |
          $v1=Get-Content '.\scripts\windows\Run-CfaStage3NewsMatchingParallel.ps1' -Raw
          $v2=Get-Content '.\scripts\windows\Run-CfaStage3NewsMatchingParallelV2.ps1' -Raw
          $r1=Get-Content '.\scripts\windows\Run-CfaStage3NewsMatchingParallelV2R1.ps1' -Raw
          $adjudicate=Get-Content '.\scripts\windows\Adjudicate-CfaStage3ExistingRun.ps1' -Raw
          foreach($text in @($v1,$v2,$r1,$adjudicate)){
            if($text -notmatch '9183757L'){throw 'Corrected 9,183,757 Stage 3 row expectation is missing.'}
            if($text -match '9091236L'){throw 'Stale 9,091,236 Stage 3 row expectation leaked into finalization code.'}
          }
          if($v2 -notmatch 'default_symbol_only'){throw 'V2 default-symbol precision rule is missing.'}
          if($v2 -notmatch 'StrongCryptoTitleRegex'){throw 'V2 strong crypto title context is missing.'}
          if($v2 -match '\(\?:crypto\|cryptocurrency\|cryptocurrencies\|blockchain\|token\|tokens\|coin\|coins'){throw 'Generic V1 crypto-title anchor leaked into V2.'}
          foreach($marker in @('Near-Term','Short-Term','Sky-High','£1 coin hack','BADGER, BAL')){if($v2 -notmatch [regex]::Escape($marker)){throw "V2 false-positive regression marker missing: $marker"}}
          if($r1 -match '\.ExitCode'){throw 'R1 controller must not depend on Process.ExitCode.'}
          foreach($marker in @('Test-WorkerComplete','reused_workers','Find-ActiveWorkerProcess','worker-summary.json')){if($r1 -notmatch [regex]::Escape($marker)){throw "R1 resume marker missing: $marker"}}
