name: CFA Stage 3 Finalization Validation

on:
  push:
    paths:
      - 'scripts/windows/Adjudicate-CfaStage3ExistingRun.ps1'
      - 'scripts/windows/Prepare-CfaStage3SampleReview.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatchingParallel.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatchingParallelV2.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatchingParallelV2R1.ps1'
      - 'scripts/windows/Test-CfaStage3NewsMatchingParallelV2Rules.ps1'
      - 'scripts/windows/Test-CfaStage3NewsMatchingParallelV2R1.ps1'
      - 'scripts/windows/Summarize-CfaStage3NewsByAsset.ps1'
      - 'scripts/windows/Apply-CfaStage3NewsMatchingV3.ps1'
      - 'scripts/windows/Prepare-CfaStage3V3SampleReview.ps1'
      - 'scripts/windows/Diagnose-CfaStage3FieldEncoding.ps1'
      - 'scripts/windows/Diagnose-CfaStage3CriticalUtf8Impact.ps1'
      - 'scripts/windows/Run-CfaStage3V3Finalization.ps1'
      - 'scripts/windows/Apply-CfaStage3NewsMatchingV4.ps1'
      - 'scripts/windows/Prepare-CfaStage3V4SampleReview.ps1'
      - 'scripts/windows/Run-CfaStage3V4Finalization.ps1'
      - '.github/workflows/stage3-finalization-validation.yml'
  pull_request:
    paths:
      - 'scripts/windows/Adjudicate-CfaStage3ExistingRun.ps1'
      - 'scripts/windows/Prepare-CfaStage3SampleReview.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatchingParallel.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatchingParallelV2.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatchingParallelV2R1.ps1'
      - 'scripts/windows/Test-CfaStage3NewsMatchingParallelV2Rules.ps1'
      - 'scripts/windows/Test-CfaStage3NewsMatchingParallelV2R1.ps1'
      - 'scripts/windows/Summarize-CfaStage3NewsByAsset.ps1'
      - 'scripts/windows/Apply-CfaStage3NewsMatchingV3.ps1'
      - 'scripts/windows/Prepare-CfaStage3V3SampleReview.ps1'
      - 'scripts/windows/Diagnose-CfaStage3FieldEncoding.ps1'
      - 'scripts/windows/Diagnose-CfaStage3CriticalUtf8Impact.ps1'
      - 'scripts/windows/Run-CfaStage3V3Finalization.ps1'
      - 'scripts/windows/Apply-CfaStage3NewsMatchingV4.ps1'
      - 'scripts/windows/Prepare-CfaStage3V4SampleReview.ps1'
      - 'scripts/windows/Run-CfaStage3V4Finalization.ps1'
      - '.github/workflows/stage3-finalization-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse finalization scripts with PowerShell 7
        shell: pwsh
        run: |
          $files=@(
            '.\scripts\windows\Adjudicate-CfaStage3ExistingRun.ps1',
            '.\scripts\windows\Prepare-CfaStage3SampleReview.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatchingParallel.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatchingParallelV2.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatchingParallelV2R1.ps1',
            '.\scripts\windows\Test-CfaStage3NewsMatchingParallelV2Rules.ps1',
            '.\scripts\windows\Test-CfaStage3NewsMatchingParallelV2R1.ps1',
            '.\scripts\windows\Summarize-CfaStage3NewsByAsset.ps1',
            '.\scripts\windows\Apply-CfaStage3NewsMatchingV3.ps1',
            '.\scripts\windows\Prepare-CfaStage3V3SampleReview.ps1',
            '.\scripts\windows\Diagnose-CfaStage3FieldEncoding.ps1',
            '.\scripts\windows\Diagnose-CfaStage3CriticalUtf8Impact.ps1',
            '.\scripts\windows\Run-CfaStage3V3Finalization.ps1',
            '.\scripts\windows\Apply-CfaStage3NewsMatchingV4.ps1',
            '.\scripts\windows\Prepare-CfaStage3V4SampleReview.ps1',
            '.\scripts\windows\Run-CfaStage3V4Finalization.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count-gt0){$errors|ForEach-Object{Write-Host "$file :: $($_.Message)"};throw "PowerShell 7 parse failed: $file"}
          }

      - name: Parse finalization scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files=@(
            '.\scripts\windows\Adjudicate-CfaStage3ExistingRun.ps1',
            '.\scripts\windows\Prepare-CfaStage3SampleReview.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatchingParallel.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatchingParallelV2.ps1',
            '.\scripts\windows\Run-CfaStage3NewsMatchingParallelV2R1.ps1',
            '.\scripts\windows\Test-CfaStage3NewsMatchingParallelV2Rules.ps1',
            '.\scripts\windows\Test-CfaStage3NewsMatchingParallelV2R1.ps1',
            '.\scripts\windows\Summarize-CfaStage3NewsByAsset.ps1',
            '.\scripts\windows\Apply-CfaStage3NewsMatchingV3.ps1',
            '.\scripts\windows\Prepare-CfaStage3V3SampleReview.ps1',
            '.\scripts\windows\Diagnose-CfaStage3FieldEncoding.ps1',
            '.\scripts\windows\Diagnose-CfaStage3CriticalUtf8Impact.ps1',
            '.\scripts\windows\Run-CfaStage3V3Finalization.ps1',
            '.\scripts\windows\Apply-CfaStage3NewsMatchingV4.ps1',
            '.\scripts\windows\Prepare-CfaStage3V4SampleReview.ps1',
            '.\scripts\windows\Run-CfaStage3V4Finalization.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count-gt0){$errors|ForEach-Object{Write-Host "$file :: $($_.Message)"};throw "Windows PowerShell 5.1 parse failed: $file"}
          }

      - name: Run exact Windows PowerShell 5.1 adjudication self-test
        shell: powershell
        run: .\scripts\windows\Adjudicate-CfaStage3ExistingRun.ps1 -SelfTest

      - name: Run exact Windows PowerShell 5.1 sample-review self-test
        shell: powershell
        run: .\scripts\windows\Prepare-CfaStage3SampleReview.ps1 -SelfTest

      - name: Run exact Windows PowerShell 5.1 parallel matcher V1 self-test
        shell: powershell
        run: .\scripts\windows\Run-CfaStage3NewsMatchingParallel.ps1 -SelfTest

      - name: Run exact Windows PowerShell 5.1 V2 rule regression test
        shell: powershell
        run: .\scripts\windows\Test-CfaStage3NewsMatchingParallelV2Rules.ps1

      - name: Run exact Windows PowerShell 5.1 V2 R1 controller test
        shell: powershell
        run: .\scripts\windows\Test-CfaStage3NewsMatchingParallelV2R1.ps1

      - name: Run exact Windows PowerShell 5.1 per-asset news count self-test
        shell: powershell
        run: .\scripts\windows\Summarize-CfaStage3NewsByAsset.ps1 -Stage3RunRoot . -SelfTest

      - name: Run exact Windows PowerShell 5.1 V3 post-filter self-test
        shell: powershell
        run: .\scripts\windows\Apply-CfaStage3NewsMatchingV3.ps1 -Stage3V2RunRoot . -OutputRoot . -SelfTest

      - name: Run exact Windows PowerShell 5.1 V3 review self-test
        shell: powershell
        run: .\scripts\windows\Prepare-CfaStage3V3SampleReview.ps1 -Stage3V3RunRoot . -OutputRoot . -SelfTest

      - name: Run exact Windows PowerShell 5.1 Stage 3 encoding self-test
        shell: powershell
        run: .\scripts\windows\Diagnose-CfaStage3FieldEncoding.ps1 -ArchiveScanCsv . -OutputRoot . -SelfTest

      - name: Run exact Windows PowerShell 5.1 Stage 3 critical UTF8 impact self-test
        shell: powershell
        run: .\scripts\windows\Diagnose-CfaStage3CriticalUtf8Impact.ps1 -ArchiveScanCsv . -Stage3V2RunRoot . -OutputRoot . -SelfTest

      - name: Run exact Windows PowerShell 5.1 V3 finalization controller self-test
        shell: powershell
        run: .\scripts\windows\Run-CfaStage3V3Finalization.ps1 -SelfTest

      - name: Run exact Windows PowerShell 5.1 V4 eligibility correction self-test
        shell: powershell
        run: .\scripts\windows\Apply-CfaStage3NewsMatchingV4.ps1 -Stage3V2RunRoot . -Stage3V3RunRoot . -ImpactRunRoot . -OutputRoot . -SelfTest

      - name: Run exact Windows PowerShell 5.1 V4 review self-test
        shell: powershell
        run: .\scripts\windows\Prepare-CfaStage3V4SampleReview.ps1 -Stage3V4RunRoot . -OutputRoot . -SelfTest

      - name: Run exact Windows PowerShell 5.1 V4 finalization controller self-test
        shell: powershell
        run: .\scripts\windows\Run-CfaStage3V4Finalization.ps1 -SelfTest

      - name: Enforce corrected Stage 3 source precision, V3 rule, UTF8 exclusion and freeze contract
        shell: powershell
        run: |
          $v1=Get-Content '.\scripts\windows\Run-CfaStage3NewsMatchingParallel.ps1' -Raw
          $v2=Get-Content '.\scripts\windows\Run-CfaStage3NewsMatchingParallelV2.ps1' -Raw
          $r1=Get-Content '.\scripts\windows\Run-CfaStage3NewsMatchingParallelV2R1.ps1' -Raw
          $adjudicate=Get-Content '.\scripts\windows\Adjudicate-CfaStage3ExistingRun.ps1' -Raw
          $v3=Get-Content '.\scripts\windows\Apply-CfaStage3NewsMatchingV3.ps1' -Raw
          $review3=Get-Content '.\scripts\windows\Prepare-CfaStage3V3SampleReview.ps1' -Raw
          $encoding=Get-Content '.\scripts\windows\Diagnose-CfaStage3FieldEncoding.ps1' -Raw
          $impact=Get-Content '.\scripts\windows\Diagnose-CfaStage3CriticalUtf8Impact.ps1' -Raw
          $controller3=Get-Content '.\scripts\windows\Run-CfaStage3V3Finalization.ps1' -Raw
          $v4=Get-Content '.\scripts\windows\Apply-CfaStage3NewsMatchingV4.ps1' -Raw
          $review4=Get-Content '.\scripts\windows\Prepare-CfaStage3V4SampleReview.ps1' -Raw
          $controller4=Get-Content '.\scripts\windows\Run-CfaStage3V4Finalization.ps1' -Raw
          foreach($text in @($v1,$v2,$r1,$adjudicate,$v3,$controller3,$impact,$v4,$controller4)){
            if($text -notmatch '9183757L'){throw 'Corrected 9,183,757 Stage 3 row expectation is missing.'}
            if($text -match '9091236L'){throw 'Stale 9,091,236 Stage 3 row expectation leaked into finalization code.'}
          }
          if($v2 -notmatch 'default_symbol_only'){throw 'V2 default-symbol precision rule is missing.'}
          if($v2 -notmatch 'StrongCryptoTitleRegex'){throw 'V2 strong crypto title context is missing.'}
          if($v2 -match '\(\?:crypto\|cryptocurrency\|cryptocurrencies\|blockchain\|token\|tokens\|coin\|coins'){throw 'Generic V1 crypto-title anchor leaked into V2.'}
          foreach($marker in @('Near-Term','Short-Term','Sky-High','£1 coin hack','BADGER, BAL')){if($v2 -notmatch [regex]::Escape($marker)){throw "V2 false-positive regression marker missing: $marker"}}
          foreach($marker in @('Test-WorkerComplete','reused_workers','Find-ActiveWorkerProcess','worker-summary.json')){if($r1 -notmatch [regex]::Escape($marker)){throw "R1 resume marker missing: $marker"}}
          foreach($marker in @('SHORT_DEFAULT_REQUIRES_TITLE_CRYPTO','APPROVED_NONDEFAULT_SAME_RECORD','IP Infrastructure','TITLE_CRYPTO','CANDIDATE_V3')){if($v3 -notmatch [regex]::Escape($marker)){throw "V3 corrective marker missing: $marker"}}
          foreach($marker in @('REJECT_V3_SHORT_SYMBOL_TITLE_CONTEXT','IP','OM','direct_semantic_review')){if($review3 -notmatch [regex]::Escape($marker)){throw "V3 semantic review marker missing: $marker"}}
          foreach($marker in @('0,1,3,4,8,12,14,23,26','CriticalIndexes0Based','CFA_S3F_008')){if($encoding -notmatch [regex]::Escape($marker)){throw "Stage 3 encoding gate marker missing: $marker"}}
          foreach($marker in @('ExpectedCriticalInvalidRows = 126L','raw_line_sha256','archive_file','row_ordinal','CFA-S3F-011','CFA-S3F-012')){if($impact -notmatch [regex]::Escape($marker)){throw "Stage 3 critical UTF8 impact marker missing: $marker"}}
          foreach($marker in @('CANDIDATE_V4','ELIGIBLE_UTF8_THEN_V3','CFA-S3F-008','FAIL','CFA-S3F-013','raw_line_sha256')){if($v4 -notmatch [regex]::Escape($marker)){throw "Stage 3 V4 eligibility marker missing: $marker"}}
          foreach($marker in @('S3V4R-','CFA_S3F_014','IP','OM','ELIGIBLE_UTF8_THEN_V3')){if($review4 -notmatch [regex]::Escape($marker)){throw "Stage 3 V4 review marker missing: $marker"}}
          foreach($marker in @('VALIDATION_CANDIDATE','CFA-S3F-008 historical encoding gate: FAIL','CFA-S3F-011','CFA-S3F-012','CFA-S3F-013','CFA-S3F-014','CFA-S3-006','BLOCKED')){if($controller4 -notmatch [regex]::Escape($marker)){throw "Stage 3 V4 fail-closed controller marker missing: $marker"}}
