name: CFA Stage 4 Day-End Diagnostic Validation

on:
  push:
    paths:
      - 'scripts/windows/Diagnose-CfaStage4DayEndCoverage.ps1'
      - 'docs/evidence/stage4-response-contract.md'
      - '.github/workflows/stage4-day-end-diagnostic-validation.yml'
  pull_request:
    paths:
      - 'scripts/windows/Diagnose-CfaStage4DayEndCoverage.ps1'
      - 'docs/evidence/stage4-response-contract.md'
      - '.github/workflows/stage4-day-end-diagnostic-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse diagnostic with PowerShell 7
        shell: pwsh
        run: |
          $file='.\scripts\windows\Diagnose-CfaStage4DayEndCoverage.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count-gt0){$errors|ForEach-Object{Write-Host "line $($_.Extent.StartLineNumber), col $($_.Extent.StartColumnNumber) :: <$($_.Extent.Text)> :: $($_.Message)"};throw 'PowerShell 7 parse failed.'}

      - name: Parse diagnostic with Windows PowerShell 5.1
        shell: powershell
        run: |
          $file='.\scripts\windows\Diagnose-CfaStage4DayEndCoverage.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count-gt0){$errors|ForEach-Object{Write-Host "line $($_.Extent.StartLineNumber), col $($_.Extent.StartColumnNumber) :: <$($_.Extent.Text)> :: $($_.Message)"};throw 'Windows PowerShell 5.1 parse failed.'}

      - name: Run diagnostic self-test
        shell: powershell
        run: .\scripts\windows\Diagnose-CfaStage4DayEndCoverage.ps1 -SelfTest

      - name: Enforce preserved diagnostic evidence
        shell: powershell
        run: |
          $script=Get-Content '.\scripts\windows\Diagnose-CfaStage4DayEndCoverage.ps1' -Raw
          $contract=Get-Content '.\docs\evidence\stage4-response-contract.md' -Raw
          foreach($marker in @(
            'EXACT_2359_FAILED',
            'LAST_OBSERVED_V2_REVIEW_FAILED',
            'CFA-S4-004',
            'FAIL',
            'CFA-S4-007',
            'PASS',
            '37,058',
            '5,134',
            '36,505',
            'CFA-S4-012',
            'RET_USD_UTC_DAY_OBS_LOG',
            'CFA-S4-015',
            'BLOCKED'
          )){
            if($contract -notmatch [regex]::Escape($marker)){throw "Contract marker missing: $marker"}
          }
          foreach($marker in @(
            'default_transaction_read_only=on',
            'stage4-day-end-pair-summary.csv',
            'stage4-day-end-global-summary.csv',
            'stage4-day-end-last-time-frequency.csv',
            'stage4-day-end-worst-200.csv',
            'stage4-day-end-AEVOUSD.csv',
            'consecutive_day_last_observed_candidates',
            'consecutive_day_exact2359_candidates',
            'CFA-S4-007',
            'PASS'
          )){
            if($script -notmatch [regex]::Escape($marker)){throw "Diagnostic marker missing: $marker"}
          }
          if($script -match '(?i)INSERT\s+INTO|UPDATE\s+[^\r\n]+\s+SET|DELETE\s+FROM|CREATE\s+TABLE|ALTER\s+TABLE|DROP\s+TABLE'){
            throw 'Stage 4 diagnostic contains forbidden write/DDL marker.'
          }
