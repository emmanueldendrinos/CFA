name: PowerShell Validation

on:
  push:
    paths:
      - 'scripts/**/*.ps1'
      - 'CFA-SoT.xlsx'
      - '.github/workflows/powershell-parse.yml'
  pull_request:
    paths:
      - 'scripts/**/*.ps1'
      - 'CFA-SoT.xlsx'
      - '.github/workflows/powershell-parse.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse scripts with PowerShell 7
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parse errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }

          if ($failed) {
            throw 'One or more PowerShell files failed to parse under PowerShell 7.'
          }

      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parse errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }

          if ($failed) {
            throw 'One or more PowerShell files failed to parse under Windows PowerShell 5.1.'
          }

      - name: Runtime self-test Kraken reconciliation under Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\windows\Reconcile-CfaKrakenSources.ps1 -SelfTest

      - name: Runtime self-test evidence publisher under Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\windows\Publish-CfaLocalEvidence.ps1 -SelfTest

      - name: Runtime self-test evidence sync wrapper under Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\windows\Sync-CfaEvidence.ps1 -SelfTest

      - name: Runtime self-test SoT authority exporter under Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\windows\Export-CfaSoTAuthority.ps1 -SelfTest

      - name: Runtime self-test news acquisition diagnosis under Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\windows\Diagnose-CfaNewsAcquisition.ps1 -SelfTest

      - name: Export current CFA SoT authority snapshot
        shell: powershell
        run: |
          .\scripts\windows\Export-CfaSoTAuthority.ps1

      - name: Commit current CFA SoT authority snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $paths = @(
            'docs/evidence/sot-authority-snapshot.md',
            'docs/evidence/sot-authority-snapshot.json'
          )
          git add -- $paths
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -gt 0) {
            foreach ($path in $staged) {
              if ($paths -notcontains $path) {
                throw "Unexpected staged path: $path"
              }
            }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update CFA SoT authority snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          }
