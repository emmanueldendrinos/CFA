name: PowerShell Validation

on:
  push:
    paths:
      - 'scripts/windows/Reconcile-CfaKrakenSources.ps1'
      - 'scripts/windows/Verify-CfaActiveNewsInputs.ps1'
      - 'scripts/windows/Verify-CfaNewsSourceCoverage.ps1'
      - 'scripts/windows/Diagnose-CfaNewsAcquisition.ps1'
      - 'scripts/windows/Acquire-CfaGdeltQ2Source.ps1'
      - 'scripts/windows/Verify-CfaGdeltQ2Source.ps1'
      - 'scripts/windows/Run-CfaStage1.ps1'
      - 'scripts/windows/Review-CfaStage2Identity.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatching.ps1'
      - 'candidate-analysis/ASRP-Q2-Pair-Identity-Frozen-v1.0.0.csv'
      - 'candidate-analysis/ASRP-Q2-GDELT-GKG-Operational-Aliases-v1.0.0.csv'
      - 'candidate-analysis/CFA-Stage2-Alias-Semantic-Decisions.csv'
      - 'docs/evidence/stage3-simple-news-matching-contract.md'
      - '.github/workflows/powershell-parse.yml'
  pull_request:
    paths:
      - 'scripts/windows/Reconcile-CfaKrakenSources.ps1'
      - 'scripts/windows/Verify-CfaActiveNewsInputs.ps1'
      - 'scripts/windows/Verify-CfaNewsSourceCoverage.ps1'
      - 'scripts/windows/Diagnose-CfaNewsAcquisition.ps1'
      - 'scripts/windows/Acquire-CfaGdeltQ2Source.ps1'
      - 'scripts/windows/Verify-CfaGdeltQ2Source.ps1'
      - 'scripts/windows/Run-CfaStage1.ps1'
      - 'scripts/windows/Review-CfaStage2Identity.ps1'
      - 'scripts/windows/Run-CfaStage3NewsMatching.ps1'
      - 'candidate-analysis/ASRP-Q2-Pair-Identity-Frozen-v1.0.0.csv'
      - 'candidate-analysis/ASRP-Q2-GDELT-GKG-Operational-Aliases-v1.0.0.csv'
      - 'candidate-analysis/CFA-Stage2-Alias-Semantic-Decisions.csv'
      - 'docs/evidence/stage3-simple-news-matching-contract.md'
      - '.github/workflows/powershell-parse.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Define active CFA scripts
        shell: powershell
        run: |
          @(
            'scripts/windows/Reconcile-CfaKrakenSources.ps1',
            'scripts/windows/Verify-CfaActiveNewsInputs.ps1',
            'scripts/windows/Verify-CfaNewsSourceCoverage.ps1',
            'scripts/windows/Diagnose-CfaNewsAcquisition.ps1',
            'scripts/windows/Acquire-CfaGdeltQ2Source.ps1',
            'scripts/windows/Verify-CfaGdeltQ2Source.ps1',
            'scripts/windows/Run-CfaStage1.ps1',
            'scripts/windows/Review-CfaStage2Identity.ps1',
            'scripts/windows/Run-CfaStage3NewsMatching.ps1'
          ) | Set-Content -LiteralPath $env:RUNNER_TEMP\active-cfa-scripts.txt

      - name: Parse active scripts with PowerShell 7
        shell: pwsh
        run: |
          $failed=$false
          foreach($path in @(Get-Content -LiteralPath $env:RUNNER_TEMP\active-cfa-scripts.txt)){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count-gt0){$failed=$true;Write-Host "Parse errors in ${path}:";$errors|ForEach-Object{Write-Host $_.Message}}
          }
          if($failed){throw 'One or more active CFA PowerShell files failed PowerShell 7 parsing.'}

      - name: Parse active scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed=$false
          foreach($path in @(Get-Content -LiteralPath $env:RUNNER_TEMP\active-cfa-scripts.txt)){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count-gt0){$failed=$true;Write-Host "Parse errors in ${path}:";$errors|ForEach-Object{Write-Host $_.Message}}
          }
          if($failed){throw 'One or more active CFA PowerShell files failed Windows PowerShell 5.1 parsing.'}

      - name: Self-test Kraken reconciliation
        shell: powershell
        run: .\scripts\windows\Reconcile-CfaKrakenSources.ps1 -SelfTest

      - name: Self-test active news input verifier
        shell: powershell
        run: .\scripts\windows\Verify-CfaActiveNewsInputs.ps1 -SelfTest

      - name: Self-test news source coverage
        shell: powershell
        run: .\scripts\windows\Verify-CfaNewsSourceCoverage.ps1 -SelfTest

      - name: Self-test news acquisition diagnosis
        shell: powershell
        run: .\scripts\windows\Diagnose-CfaNewsAcquisition.ps1 -SelfTest

      - name: Self-test GDELT Q2 acquisition
        shell: powershell
        run: .\scripts\windows\Acquire-CfaGdeltQ2Source.ps1 -SelfTest

      - name: Self-test GDELT Q2 verification
        shell: powershell
        run: .\scripts\windows\Verify-CfaGdeltQ2Source.ps1 -SelfTest

      - name: Self-test Stage 1 runner
        shell: powershell
        run: .\scripts\windows\Run-CfaStage1.ps1 -SelfTest

      - name: Self-test Stage 2 Kraken and alias readiness
        shell: powershell
        run: .\scripts\windows\Review-CfaStage2Identity.ps1 -SelfTest

      - name: Self-test Stage 3 news matcher
        shell: powershell
        run: .\scripts\windows\Run-CfaStage3NewsMatching.ps1 -SelfTest

      - name: Verify exact active input bytes
        shell: powershell
        run: .\scripts\windows\Verify-CfaActiveNewsInputs.ps1

      - name: Resolve Stage 2 Kraken and alias readiness
        shell: powershell
        run: |
          & .\scripts\windows\Review-CfaStage2Identity.ps1
          $code=if($null-eq$LASTEXITCODE){0}else{[int]$LASTEXITCODE}
          if($code-ne0){throw "Stage 2 Kraken/GDELT readiness failed with exit $code."}

      - name: Enforce simple Stage 3 entry gate
        shell: powershell
        run: |
          $review=Get-Content -LiteralPath '.\docs\evidence\stage2-identity-review.json' -Raw | ConvertFrom-Json
          $byId=@{};foreach($g in @($review.gates)){$byId[[string]$g.gate_id]=$g}
          if([string]$byId['CFA-S2-002'].status-ne'NOT_APPLICABLE'){throw 'Retired CoinGecko structural gate is active.'}
          if([string]$byId['CFA-S2-003'].status-ne'NOT_APPLICABLE'){throw 'Retired CoinGecko mapping gate is active.'}
          if([string]$byId['CFA-S2-005'].status-ne'PASS'){throw 'Alias semantic validation is not PASS.'}
          if([string]$byId['CFA-S2-006'].status-ne'PASS'){throw 'Stage 3 entry gate is not PASS.'}
          Write-Host 'CFA SIMPLE STAGE 3 ENTRY GATE: PASS'

      - name: Commit active Stage 2 readiness evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $allowed=@(
            'candidate-analysis/CFA-Stage2-Alias-Review.csv',
            'docs/evidence/stage2-identity-review.md',
            'docs/evidence/stage2-identity-review.json'
          )
          git -c core.autocrlf=false add -- $allowed
          $staged=@(git diff --cached --name-only)
          foreach($path in $staged){if($allowed-notcontains$path){throw "Unexpected staged active-news evidence path: $path"}}
          $unstaged=@(git diff --name-only)
          if($unstaged.Count-gt0){throw ('Unexpected unstaged paths before active-news evidence commit: '+($unstaged-join','))}
          if($staged.Count-gt0){
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish CFA Kraken and GDELT news readiness evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          }
