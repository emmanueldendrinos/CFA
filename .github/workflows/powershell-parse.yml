name: PowerShell Validation

on:
  push:
    paths:
      - 'scripts/**/*.ps1'
      - 'CFA-SoT.xlsx'
      - 'candidate-analysis/*.csv'
      - '.github/workflows/powershell-parse.yml'
  pull_request:
    paths:
      - 'scripts/**/*.ps1'
      - 'CFA-SoT.xlsx'
      - 'candidate-analysis/*.csv'
      - '.github/workflows/powershell-parse.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse scripts with PowerShell 7
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parse errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { throw 'One or more PowerShell files failed to parse under PowerShell 7.' }

      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parse errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { throw 'One or more PowerShell files failed to parse under Windows PowerShell 5.1.' }

      - name: Runtime self-test Kraken reconciliation under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Reconcile-CfaKrakenSources.ps1 -SelfTest

      - name: Runtime self-test evidence publisher under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Publish-CfaLocalEvidence.ps1 -SelfTest

      - name: Runtime self-test evidence sync wrapper under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Sync-CfaEvidence.ps1 -SelfTest

      - name: Runtime self-test SoT authority exporter under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Export-CfaSoTAuthority.ps1 -SelfTest

      - name: Runtime self-test reference source reconciler under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Reconcile-CfaReferenceSources.ps1 -SelfTest

      - name: Runtime self-test news source coverage under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Verify-CfaNewsSourceCoverage.ps1 -SelfTest

      - name: Runtime self-test news acquisition diagnosis under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Diagnose-CfaNewsAcquisition.ps1 -SelfTest

      - name: Runtime self-test CFA GDELT Q2 acquisition under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Acquire-CfaGdeltQ2Source.ps1 -SelfTest

      - name: Runtime self-test CFA GDELT Q2 verification under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Verify-CfaGdeltQ2Source.ps1 -SelfTest

      - name: Runtime self-test Stage 1 runner under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Run-CfaStage1.ps1 -SelfTest

      - name: Runtime self-test Stage 2 identity reviewer under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Review-CfaStage2Identity.ps1 -SelfTest

      - name: Runtime self-test CoinGecko identity acquisition under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Acquire-CfaCoinGeckoIdentityEvidence.ps1 -SelfTest

      - name: Runtime self-test Stage 2 evidence publisher under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Publish-CfaStage2Evidence.ps1 -SelfTest

      - name: Runtime self-test Stage 2 evidence sync under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Sync-CfaStage2Evidence.ps1 -SelfTest

      - name: Runtime self-test Stage 2 runner under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Run-CfaStage2.ps1 -SelfTest

      - name: Export current CFA SoT authority snapshot
        shell: powershell
        run: .\scripts\windows\Export-CfaSoTAuthority.ps1

      - name: Reconcile and guarded-repair exact reference source bytes
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\windows\Reconcile-CfaReferenceSources.ps1' -RepairExactEncodingVariant
          $code = $LASTEXITCODE
          "REFERENCE_GATE_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Reference reconciliation gate exit: $code"
          exit 0

      - name: Run Stage 2 structural identity review
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\windows\Review-CfaStage2Identity.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Stage 2 structural reviewer failed with exit $LASTEXITCODE." }

      - name: Commit generated authority/reconciliation/Stage 2 evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $allowed = @(
            'docs/evidence/sot-authority-snapshot.md',
            'docs/evidence/sot-authority-snapshot.json',
            'docs/evidence/reference-source-reconciliation.md',
            'docs/evidence/reference-source-reconciliation.json',
            'docs/evidence/stage2-identity-review.md',
            'docs/evidence/stage2-identity-review.json',
            'candidate-analysis/ASRP-Q2-Pair-Identity-Frozen-v1.0.0.csv',
            'candidate-analysis/ASRP-Q2-News-Hype-CoinGecko-Mapping-Candidates-20260818-120451-583-f5fd1391.csv',
            'candidate-analysis/ASRP-Q2-GDELT-GKG-Operational-Aliases-v1.0.0.csv',
            'candidate-analysis/CFA-Stage2-CoinGecko-Review-Queue.csv',
            'candidate-analysis/CFA-Stage2-Alias-Review.csv'
          )
          git -c core.autocrlf=false add -- $allowed
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -gt 0) {
            foreach ($path in $staged) {
              if ($allowed -notcontains $path) { throw "Unexpected staged path: $path" }
            }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update CFA source and Stage 2 structural evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Enforce reference source hard gate
        shell: powershell
        run: |
          if ($env:REFERENCE_GATE_EXIT -ne '0') {
            throw "CFA reference source reconciliation remains unresolved (exit $env:REFERENCE_GATE_EXIT). See docs/evidence/reference-source-reconciliation.md."
          }
