name: PowerShell Parse Check

on:
  push:
    paths:
      - 'scripts/**/*.ps1'
      - '.github/workflows/powershell-parse.yml'
  pull_request:
    paths:
      - 'scripts/**/*.ps1'
      - '.github/workflows/powershell-parse.yml'

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parse errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }

          if ($failed) {
            throw 'One or more PowerShell files failed to parse.'
          }
