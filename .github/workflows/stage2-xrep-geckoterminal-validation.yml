name: Stage 2 XREP GeckoTerminal Validation

on:
  push:
    paths:
      - 'scripts/windows/Verify-CfaStage2XrepGeckoTerminal.ps1'
      - 'scripts/windows/Validate-CfaStage2XrepBlocker.ps1'
      - 'candidate-analysis/CFA-Stage2-GeckoTerminal-Xrep-Seeds.csv'
      - 'candidate-analysis/CFA-Stage2-GeckoTerminal-Xrep-Evidence.csv'
      - 'candidate-analysis/CFA-Stage2-Xrep-Blocker-Evidence.csv'
      - 'candidate-analysis/CFA-Stage2-Mapping-Adjudications-03.csv'
      - 'candidate-analysis/CFA-Stage2-Direct-CoinGecko-ID-Evidence.csv'
      - 'docs/evidence/stage2-xrep-geckoterminal-evidence.md'
      - '.github/workflows/stage2-xrep-geckoterminal-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse XREP scripts with PowerShell 7
        shell: pwsh
        run: |
          foreach($path in @('.\scripts\windows\Verify-CfaStage2XrepGeckoTerminal.ps1','.\scripts\windows\Validate-CfaStage2XrepBlocker.ps1')){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; throw "XREP Stage 2 script failed PowerShell 7 parsing: $path" }
          }

      - name: Parse XREP scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($path in @('.\scripts\windows\Verify-CfaStage2XrepGeckoTerminal.ps1','.\scripts\windows\Validate-CfaStage2XrepBlocker.ps1')){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; throw "XREP Stage 2 script failed Windows PowerShell 5.1 parsing: $path" }
          }

      - name: Self-test XREP verifier
        shell: powershell
        run: .\scripts\windows\Verify-CfaStage2XrepGeckoTerminal.ps1 -SelfTest

      - name: Self-test XREP blocker validator
        shell: powershell
        run: .\scripts\windows\Validate-CfaStage2XrepBlocker.ps1 -SelfTest

      - name: Validate frozen XREP blocker evidence
        shell: powershell
        run: .\scripts\windows\Validate-CfaStage2XrepBlocker.ps1

      - name: Acquire exact XREP and REPv2 identity evidence for drift check
        shell: powershell
        run: .\scripts\windows\Verify-CfaStage2XrepGeckoTerminal.ps1

      - name: Assert live XREP blocker semantics
        shell: powershell
        run: |
          $path='candidate-analysis/CFA-Stage2-GeckoTerminal-Xrep-Evidence.csv'
          $rows=@(Import-Csv -LiteralPath $path)
          if($rows.Count-ne4){throw "Live XREP drift evidence must contain 4 rows; observed $($rows.Count)."}
          $specs=@(
            [pscustomobject]@{role='Q2_XREP_REPV1';base='XREP';address='0x1985365e9f78359a9b6ad760e32412f4a445e862';name='Reputation';symbol='REP';id='';identity='UNVERIFIED_EMPTY_COINGECKO_ID'},
            [pscustomobject]@{role='Q2_REPV2';base='REPV2';address='0x221657776846890989a759ba2973e427dff5c9bb';name='Reputation';symbol='REPv2';id='augur';identity='PASS_EXPLICIT_COINGECKO_ID'}
          )
          foreach($spec in $specs){
            $matches=@($rows|Where-Object{[string]$_.token_role-eq$spec.role})
            if($matches.Count-ne2){throw "Live XREP drift role $($spec.role) must contain 2 endpoint rows; observed $($matches.Count)."}
            $endpoints=@($matches|ForEach-Object{[string]$_.endpoint_type}|Sort-Object -Unique)
            if($endpoints.Count-ne2-or$endpoints-notcontains'token_info'-or$endpoints-notcontains'token_data'){throw "Live XREP drift endpoint coverage changed for $($spec.role)."}
            foreach($row in $matches){
              if([string]$row.base_asset_id-ne$spec.base){throw "Live XREP base changed for $($spec.role): $([string]$row.base_asset_id)"}
              if([int]$row.http_status-ne200-or[string]$row.parse_status-ne'PASS'){throw "Live XREP request/parse changed for $($spec.role)/$([string]$row.endpoint_type): http=$([string]$row.http_status) parse=$([string]$row.parse_status)"}
              if(-not([string]$row.token_address).Equals($spec.address,[System.StringComparison]::OrdinalIgnoreCase)){throw "Live XREP token address changed for $($spec.role)."}
              if(-not([string]$row.returned_address).Equals($spec.address,[System.StringComparison]::OrdinalIgnoreCase)){throw "Live XREP returned address changed for $($spec.role)."}
              if([string]$row.returned_name-ne$spec.name-or-not([string]$row.returned_symbol).Equals($spec.symbol,[System.StringComparison]::OrdinalIgnoreCase)){throw "Live XREP name/symbol changed for $($spec.role): $([string]$row.returned_name)/$([string]$row.returned_symbol)"}
              if([string]$row.coingecko_coin_id-ne$spec.id){throw "Live XREP CoinGecko ID changed for $($spec.role): expected='$($spec.id)' observed='$([string]$row.coingecko_coin_id)'. Re-adjudication required."}
              if([string]$row.identity_status-ne$spec.identity){throw "Live XREP identity status changed for $($spec.role): $([string]$row.identity_status). Re-adjudication required."}
            }
          }
          Write-Host 'LIVE XREP BLOCKER SEMANTICS: PASS'

      - name: Resolve Stage 2 mappings with XREP blocker
        shell: powershell
        run: |
          $global:LASTEXITCODE=$null
          & .\scripts\windows\Resolve-CfaStage2Mappings.ps1
          $resolverCode=if($null-eq$LASTEXITCODE){0}else{[int]$LASTEXITCODE}
          if ($resolverCode -ne 0) { throw "Stage 2 mapping resolver failed with exit $resolverCode." }
          $global:LASTEXITCODE=$null
          & .\scripts\windows\Apply-CfaStage2CanonicalMappings.ps1
          $overlayCode=if($null-eq$LASTEXITCODE){0}else{[int]$LASTEXITCODE}
          if ($overlayCode -ne 0) { throw "Stage 2 canonical mapping overlay failed with exit $overlayCode." }
          $global:LASTEXITCODE=0

      - name: Upload XREP GeckoTerminal drift evidence
        uses: actions/upload-artifact@v4
        with:
          name: cfa-stage2-xrep-geckoterminal-evidence
          path: |
            candidate-analysis/CFA-Stage2-GeckoTerminal-Xrep-Evidence.csv
            docs/evidence/stage2-xrep-geckoterminal-evidence.md
          if-no-files-found: error
          retention-days: 7
