name: CFA Stage 11 Scanner Source Readiness Validation

on:
  push:
    branches:
      - cfa/stage11-live-scanner-contract-20260910
    paths:
      - 'scripts/windows/Run-CfaStage11ScannerSourceReadiness.ps1'
      - 'docs/evidence/stage11-scanner-source-readiness-contract.md'
      - '.github/workflows/stage11-scanner-source-readiness-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Stage 11 source-readiness runner with PowerShell 7
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\windows\Run-CfaStage11ScannerSourceReadiness.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|ForEach-Object{Write-Host "line $($_.Extent.StartLineNumber), col $($_.Extent.StartColumnNumber) :: <$($_.Extent.Text)> :: $($_.Message)"};throw 'PowerShell 7 Stage 11 parse failed.'}
      - name: Parse Stage 11 source-readiness runner with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\windows\Run-CfaStage11ScannerSourceReadiness.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|ForEach-Object{Write-Host "line $($_.Extent.StartLineNumber), col $($_.Extent.StartColumnNumber) :: <$($_.Extent.Text)> :: $($_.Message)"};throw 'Windows PowerShell 5.1 Stage 11 parse failed.'}
      - name: Run Stage 11 self-test in PowerShell 7
        shell: pwsh
        run: .\scripts\windows\Run-CfaStage11ScannerSourceReadiness.ps1 -Stage5CandidateReceiptPath x -Stage10RunReceiptPath x -Stage10ValidationReceiptPath x -SelfTest
      - name: Run Stage 11 self-test in Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\Run-CfaStage11ScannerSourceReadiness.ps1 -Stage5CandidateReceiptPath x -Stage10RunReceiptPath x -Stage10ValidationReceiptPath x -SelfTest
      - name: Enforce source-readiness boundary
        shell: pwsh
        run: |
          $contract=Get-Content '.\docs\evidence\stage11-scanner-source-readiness-contract.md' -Raw
          foreach($marker in @('SOURCE_WINDOW_INCOMPLETE','60 minutes','240 minutes','forward 60m or 240m returns','SCANNER_IMPLEMENTATION_BLOCKED')){if($contract -notmatch [regex]::Escape($marker)){throw "Missing Stage 11 source-readiness marker: $marker"}}
          $script=Get-Content '.\scripts\windows\Run-CfaStage11ScannerSourceReadiness.ps1' -Raw
          foreach($marker in @('default_transaction_read_only=on','no_minimum_support_threshold_applied','Forward outcomes inspected: False','Stage5CandidateReceiptPath')){if($script -notmatch [regex]::Escape($marker)){throw "Missing Stage 11 implementation guard: $marker"}}
          if($script -match 'FWD_ABNORMAL|FWD_RETURN|precision|recall|hit_rate'){throw 'Stage 11 source-readiness runner contains forbidden forward-performance logic.'}
